name: Validate retained ORCJIT ARM64 wheel

on:
  push:
    branches: [orcjit-arm64-validation-855]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
      - uses: actions/download-artifact@v4
        with:
          name: cibw-orcjit-wheels-windows-11-arm-ARM64-0
          run-id: 40264510479
          github-token: ${{ github.token }}
          path: wheelhouse
      - name: Install retained wheel and released core
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem wheelhouse/*.whl)[0].FullName
          python -m pip install "apache-tvm-ffi==0.1.15.post1" "$wheel" pytest pytest-xdist ninja mlc-llvm-static==23.1.1.post0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Validate object lifecycle and generated function execution
        shell: pwsh
        run: |
          python -m pytest addons/tvm_ffi_orcjit/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python addons/tvm_ffi_orcjit/examples/quick-start/run.py --lang c
