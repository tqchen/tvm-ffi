name: Publish OrcJIT wheel

on:
  push:
    branches: [orcjit-arm64-validation-855]
  workflow_dispatch:
    inputs:
      tag:
        description: "Branch, tag or SHA to build"
        required: true
      publish:
        description: "Publish built wheels to PyPI"
        type: boolean
        default: false
        required: true

jobs:
  build_wheels:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-11-arm, arch: ARM64, build: "cp312-win_arm64"}

    steps:
      - name: Checkout repository (for local composite action)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Build OrcJIT wheel
        uses: ./.github/actions/build-orcjit-wheel
        with:
          arch: ${{ matrix.arch }}
          build: ${{ matrix.build }}
          checkout_ref: ${{ github.sha }}

      - name: Upload wheels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cibw-orcjit-wheels-${{ matrix.os }}-${{ matrix.arch }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-orcjit-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestation for wheels
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true
          verbose: true
